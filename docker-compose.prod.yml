services:
  # ── 1. PostgreSQL 16 with PostGIS ──────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: farmermarket-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farmermarket}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set strong POSTGRES_PASSWORD in .env.production}
      TZ: Africa/Addis_Ababa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-farmermarket}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - farmermarket-net

  # ── 2. Redis 7 (Caching, OTP & Rate Limiting) ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: farmermarket-redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:?Set strong REDIS_PASSWORD in .env.production}"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - farmermarket-net

  # ── 3. ASP.NET Core 10 Web API Backend ─────────────────────────────────────
  api:
    build:
      context: ./FarmerMarket
      dockerfile: Dockerfile
    container_name: farmermarket-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-farmermarket};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};Include Error Detail=false"
      Jwt__Key: ${JWT_KEY:?Set 64+ char JWT_KEY in .env.production}
      Jwt__Issuer: ${JWT_ISSUER:-https://farmermarket.et}
      Jwt__Audience: ${JWT_AUDIENCE:-https://farmermarket.et}
      Jwt__ExpiryDays: ${JWT_EXPIRY_DAYS:-30}
      Chapa__SecretKey: ${CHAPA_SECRET_KEY:-}
      Chapa__PublicKey: ${CHAPA_PUBLIC_KEY:-}
      Chapa__WebhookSecret: ${CHAPA_WEBHOOK_SECRET:-}
      Chapa__BaseUrl: ${CHAPA_BASE_URL:-https://api.chapa.co/v1}
      Telebirr__AppId: ${TELEBIRR_APP_ID:-}
      Telebirr__ShortCode: ${TELEBIRR_SHORT_CODE:-}
      Telebirr__AppKey: ${TELEBIRR_APP_KEY:-}
      Telebirr__BaseUrl: ${TELEBIRR_BASE_URL:-https://telebirr.et/pay}
      Sms__Provider: ${SMS_PROVIDER:-AfroMessage}
      Sms__AfroMessage__ApiKey: ${AFROMESSAGE_API_KEY:-}
      Sms__AfroMessage__From: ${AFROMESSAGE_SENDER_ID:-FarmerMkt}
      Email__Host: ${SMTP_HOST:-smtp.gmail.com}
      Email__Port: ${SMTP_PORT:-587}
      Email__Username: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromEmail: ${SMTP_FROM_EMAIL:-noreply@farmermarket.et}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,https://farmermarket.et}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - farmermarket-net

  # ── 4. Nginx Web SPA Frontend & Reverse Proxy ──────────────────────────────
  web:
    build:
      context: ./farmer-market-web
      dockerfile: Dockerfile
    container_name: farmermarket-web
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - farmermarket-net

networks:
  farmermarket-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
