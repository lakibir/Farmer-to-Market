services:
  # ── 1. Backend Web API (ASP.NET Core 10 Docker Service) ──────────────────────
  - type: web
    name: farmermarket-api
    runtime: docker
    dockerfilePath: ./FarmerMarket/Dockerfile
    dockerContext: ./FarmerMarket
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Default
        fromDatabase:
          name: farmermarket-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: https://farmermarket.et
      - key: Jwt__Audience
        value: https://farmermarket.et
      - key: Jwt__ExpiryDays
        value: 30
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: SeedDemoData
        value: "true"

  # ── 2. Frontend Web App (Vite Static Site on Render) ────────────────────────
  - type: web
    name: farmermarket-web
    runtime: static
    rootDir: farmer-market-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: farmermarket-api
          property: url

# ── 3. Managed PostgreSQL Database ───────────────────────────────────────────
databases:
  - name: farmermarket-db
    databaseName: farmermarket
    user: farmermarket_user
    plan: free
